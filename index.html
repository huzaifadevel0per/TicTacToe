  <style>
    .hud { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3); }
    .stat { display: grid; gap: 2px; min-width: 78px; padding: var(--space-2) var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
    .stat span { color: var(--muted); font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .stat strong { font-size: 1.125rem; font-variant-numeric: tabular-nums; }

    .seg { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--surface); }
    .seg button { padding: 6px 14px; border: 0; border-radius: var(--radius-full); background: transparent; color: var(--muted); font-size: 0.8125rem; cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
    #restart { margin-left: auto; }

    .status {
      display: flex;
      align-items: center;
      min-height: 44px;
      margin: 0 0 var(--space-4);
      padding: 0 var(--space-4);
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
      background: var(--surface-2);
      font-size: 0.9375rem;
    }

    .status[data-tone="win"] { color: var(--success); }
    .status[data-tone="lose"] { color: var(--danger); }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 380px;
      margin-inline: auto;
    }

    .cell {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      font-family: var(--font-mono);
      font-size: clamp(1.75rem, 7vw, 2.75rem);
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 120ms var(--ease), background 120ms var(--ease);
    }

    .cell:hover { border-color: var(--primary); }
    .cell[data-mark="X"] { color: var(--primary); }
    .cell[data-mark="O"] { color: var(--accent); }
    .cell.win { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }

    .hint { margin: var(--space-3) 0 0; color: var(--muted); font-size: 0.875rem; text-align: center; }

    @media (max-width: 560px) {
      #restart { margin-left: 0; }
    }
  </style>
</head>

    <!-- <h1>Tic-Tac-Toe</h1> -->
    <p class="lede">You are X and you always move first. Easy picks random squares, Smart plays a perfect game.</p>

    <div class="hud">
      <div class="stat"><span>You</span><strong id="wins">0</strong></div>
      <div class="stat"><span>Computer</span><strong id="losses">0</strong></div>
      <div class="stat"><span>Draws</span><strong id="draws">0</strong></div>
      <div class="seg" role="group" aria-label="Difficulty">
        <button type="button" data-level="easy" aria-pressed="false">Easy</button>
        <button type="button" data-level="smart" aria-pressed="true">Smart</button>
        <button type="button" data-level="two" aria-pressed="false">2 Player</button>
      </div>
      <button class="btn" id="restart" type="button">New round</button>
      <button class="btn" id="reset-scores" type="button">Reset scores</button>
      <button class="btn" id="sound" type="button" aria-pressed="false">Sound: off</button>
    </div>

    <p class="status" id="status" data-tone="idle" aria-live="polite">You are X &mdash; your move.</p>

    <div class="board" id="board" role="group" aria-label="Tic-tac-toe board"></div>

    <p class="hint">Scores are for this session only. Keys 1&ndash;9 pick a square.</p>
  </div>

  <script>
    (function () {
      var LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];

      var boardEl = document.getElementById('board');
      var statusEl = document.getElementById('status');
      var winsEl = document.getElementById('wins');
      var lossesEl = document.getElementById('losses');
      var drawsEl = document.getElementById('draws');
      var restartBtn = document.getElementById('restart');
      var levelButtons = document.querySelectorAll('[data-level]');

      var board = ['', '', '', '', '', '', '', '', ''];
      var cells = [];
      var level = 'smart';
      var turn = 'X';
      var over = false;
      var wins = 0;
      var losses = 0;
      var draws = 0;
      var aiTimer = null;

      for (var i = 0; i < 9; i++) {
        var cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'cell';
        cell.dataset.index = String(i);
        cell.setAttribute('aria-label', 'Square ' + (i + 1) + ', empty');
        boardEl.appendChild(cell);
        cells.push(cell);
      }

      function winnerOf(b) {
        for (var i = 0; i < LINES.length; i++) {
          var line = LINES[i];
          if (b[line[0]] && b[line[0]] === b[line[1]] && b[line[1]] === b[line[2]]) return line;
        }
        return null;
      }

      function setStatus(text, tone) {
        statusEl.textContent = text;
        statusEl.dataset.tone = tone || 'idle';
      }

      function paint(index) {
        var cell = cells[index];
        var mark = board[index];
        cell.textContent = mark;
        if (mark) cell.dataset.mark = mark;
        else cell.removeAttribute('data-mark');
        cell.setAttribute('aria-label', 'Square ' + (index + 1) + ', ' + (mark || 'empty'));
      }

      function place(index, mark) {
        board[index] = mark;
        paint(index);
      }

      function settleIfOver() {
        var line = winnerOf(board);
        if (line) {
          over = true;
          for (var i = 0; i < line.length; i++) cells[line[i]].classList.add('win');
          if (board[line[0]] === 'X') {
            wins++;
            winsEl.textContent = String(wins);
            setStatus(level === 'two' ? 'X wins \u2014 nice line.' : 'You win \u2014 nice line.', 'win');
            sfx('win');
          } else {
            losses++;
            lossesEl.textContent = String(losses);
            setStatus(level === 'two' ? 'O wins this one.' : 'Computer wins this one.', 'lose');
            sfx('lose');
          }
          return true;
        }
        if (board.indexOf('') === -1) {
          over = true;
          draws++;
          drawsEl.textContent = String(draws);
          setStatus('Draw \u2014 nobody cracked it.', 'idle');
          sfx('draw');
          return true;
        }
        return false;
      }

      function score(b, maximize) {
        var line = winnerOf(b);
        if (line) return b[line[0]] === 'O' ? 1 : -1;
        if (b.indexOf('') === -1) return 0;
        var bestScore = maximize ? -2 : 2;
        for (var i = 0; i < 9; i++) {
          if (b[i]) continue;
          b[i] = maximize ? 'O' : 'X';
          var value = score(b, !maximize);
          b[i] = '';
          bestScore = maximize ? Math.max(bestScore, value) : Math.min(bestScore, value);
        }
        return bestScore;
      }

      function bestMove() {
        var bestScore = -2;
        var move = -1;
        for (var i = 0; i < 9; i++) {
          if (board[i]) continue;
          board[i] = 'O';
          var value = score(board, false);
          board[i] = '';
          if (value > bestScore) {
            bestScore = value;
            move = i;
          }
        }
        return move;
      }

      function easyMove() {
        var empty = [];
        for (var i = 0; i < 9; i++) if (!board[i]) empty.push(i);
        return empty[Math.floor(Math.random() * empty.length)];
      }

      function aiTurn() {
        aiTimer = null;
        if (over) return;
        var index = level === 'easy' ? easyMove() : bestMove();
        place(index, 'O');
        if (settleIfOver()) return;
        turn = 'X';
        boardEl.dataset.turn = 'X';
        setStatus('Your move.', 'idle');
      }

      function humanMove(index) {
        if (over || board[index]) return;
        if (level === 'two') {
          place(index, turn);
          sfx('tap');
          if (settleIfOver()) return;
          turn = turn === 'X' ? 'O' : 'X';
          boardEl.dataset.turn = turn;
          setStatus(turn + '\u2019s move.', 'idle');
          return;
        }
        if (turn !== 'X') return;
        place(index, 'X');
        sfx('tap');
        if (settleIfOver()) return;
        turn = 'O';
        boardEl.dataset.turn = 'O';
        setStatus('Computer is thinking\u2026', 'idle');
        aiTimer = setTimeout(aiTurn, 340);
      }

      document.addEventListener('keydown', function (event) {
        var n = Number(event.key);
        if (n >= 1 && n <= 9) humanMove(n - 1);
      });

      var ctx = null;
      var soundOn = false;
      var soundBtn = document.getElementById('sound');
      try { soundOn = localStorage.getItem('p4demo:sound') === 'on'; } catch (e) {}

      function paintSound() {
        soundBtn.textContent = 'Sound: ' + (soundOn ? 'on' : 'off');
        soundBtn.setAttribute('aria-pressed', String(soundOn));
      }

      function beep(freq, duration, delay) {
        var Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return;
        if (!ctx) ctx = new Ctor();
        if (ctx.state === 'suspended') ctx.resume().catch(function () {});
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        var start = ctx.currentTime + delay;
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.2, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        osc.connect(gain).connect(ctx.destination);
        osc.start(start);
        osc.stop(start + duration + 0.02);
      }

      function sfx(kind) {
        if (!soundOn) return;
        if (kind === 'tap') beep(440, 0.08, 0);
        if (kind === 'win') { beep(523, 0.12, 0); beep(659, 0.12, 0.12); beep(784, 0.2, 0.24); }
        if (kind === 'lose') { beep(330, 0.15, 0); beep(220, 0.3, 0.15); }
        if (kind === 'draw') beep(392, 0.2, 0);
      }

      soundBtn.addEventListener('click', function () {
        soundOn = !soundOn;
        try { localStorage.setItem('p4demo:sound', soundOn ? 'on' : 'off'); } catch (e) {}
        paintSound();
        if (soundOn) sfx('tap');
      });
      paintSound();

      document.getElementById('reset-scores').addEventListener('click', function () {
        wins = losses = draws = 0;
        winsEl.textContent = lossesEl.textContent = drawsEl.textContent = '0';
      });

      boardEl.addEventListener('click', function (event) {
        var cell = event.target.closest('.cell');
        if (!cell) return;
        humanMove(Number(cell.dataset.index));
      });

      function newRound() {
        clearTimeout(aiTimer);
        aiTimer = null;
        board = ['', '', '', '', '', '', '', '', ''];
        turn = 'X';
        over = false;
        boardEl.dataset.turn = 'X';
        for (var i = 0; i < 9; i++) {
          cells[i].textContent = '';
          cells[i].removeAttribute('data-mark');
          cells[i].classList.remove('win');
          cells[i].setAttribute('aria-label', 'Square ' + (i + 1) + ', empty');
        }
        setStatus(level === 'two' ? 'X moves first.' : 'You are X \u2014 your move.', 'idle');
      }

      restartBtn.addEventListener('click', newRound);

      var youLabel = winsEl.previousElementSibling;
      var cpuLabel = lossesEl.previousElementSibling;

      for (var b = 0; b < levelButtons.length; b++) {
        (function (button) {
          button.addEventListener('click', function () {
            level = button.dataset.level;
            boardEl.dataset.level = level;
            for (var i = 0; i < levelButtons.length; i++) {
              levelButtons[i].setAttribute('aria-pressed', String(levelButtons[i] === button));
            }
            youLabel.textContent = level === 'two' ? 'X' : 'You';
            cpuLabel.textContent = level === 'two' ? 'O' : 'Computer';
            newRound();
          });
        })(levelButtons[b]);
      }

      // document.querySelector('[data-theme-toggle]').addEventListener('click', function () {
      //   var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      //   document.documentElement.dataset.theme = next;
      //   try { localStorage.setItem('p4demo:theme', next); } catch (e) {}
      // });

      boardEl.dataset.level = level;
      newRound();
    })();
  </script>
